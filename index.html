<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Triple Challenge Gauntlet</title>
<style>
  body {
    margin: 0;
    background: #05060a;
    color: #f5f5f5;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 600px;
    padding: 20px;
  }

  .active {
    display: flex;
  }

  h1 {
    margin-bottom: 10px;
    color: #9fa6ff;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  button {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    padding: 10px 20px;
    border-radius: 999px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    opacity: 0.9;
  }

  /* Memory Game */
  .memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 60px);
    gap: 10px;
    margin-top: 20px;
  }

  .memory-card {
    width: 60px;
    height: 60px;
    background: #111322;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .memory-card.revealed {
    background: #2f365f;
    border-color: #6366f1;
  }

  .memory-card.matched {
    background: #1b4332;
    border-color: #2ecc71;
    color: #a9f5c6;
    cursor: default;
  }

  /* Tic Tac Toe */
  #tttBoard {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 6px;
    margin-top: 20px;
  }

  .ttt-cell {
    width: 100px;
    height: 100px;
    background: #111322;
    border-radius: 10px;
    font-size: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.1);
  }

  /* Simon Colors */
  #simonButtons {
    display: grid;
    grid-template-columns: repeat(3, 120px);
    gap: 15px;
    margin-top: 20px;
  }

  .color-btn {
    width: 120px;
    height: 120px;
    border-radius: 12px;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.2s;
  }

  .color-btn.active {
    opacity: 1;
    box-shadow: 0 0 20px white;
  }

  /* Final Message */
  #finalMessage {
    font-size: 60px;
    font-weight: 900;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<!-- SCREEN 1: MEMORY -->
<div id="screen1" class="screen active">
  <h1>Challenge 1 — Memory Match</h1>
  <p>Match all pairs to continue.</p>
  <div class="memory-grid" id="memoryGrid"></div>
</div>

<!-- SCREEN 2: TIC TAC TOE -->
<div id="screen2" class="screen">
  <h1>Challenge 2 — Tic Tac Toe</h1>
  <p>Beat the bot. You have 3 tries.</p>
  <div id="tttBoard"></div>
  <p id="tttStatus"></p>
</div>

<!-- SCREEN 3: SIMON COLORS -->
<div id="screen3" class="screen">
  <h1>Challenge 3 — Color Memory</h1>
  <p>Repeat the sequence. 3 rounds.</p>
  <div id="simonButtons"></div>
  <p id="simonStatus"></p>
</div>

<!-- FINAL SCREEN -->
<div id="finalScreen" class="screen">
  <div id="finalMessage"></div>
  <button onclick="restartGame()">Play Again</button>
</div>

<script>
/* Encoded secret phrase */
const hiddenPayload = "YmxhY2sgbmlwcGxlcw==";

/* Screen switching */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* -------------------------
   CHALLENGE 1 — MEMORY
--------------------------*/
(function memoryGame() {
  const symbols = ["◆","◆","●","●","★","★","▲","▲"];
  const grid = document.getElementById("memoryGrid");
  let first = null, second = null, lock = false, matched = 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function build() {
    grid.innerHTML = "";
    matched = 0;
    shuffle(symbols.slice()).forEach(sym => {
      const card = document.createElement("div");
      card.className = "memory-card";
      card.dataset.symbol = sym;
      card.onclick = () => reveal(card);
      grid.appendChild(card);
    });
  }

  function reveal(card) {
    if (lock || card.classList.contains("matched") || card === first) return;
    card.classList.add("revealed");
    card.textContent = card.dataset.symbol;

    if (!first) {
      first = card;
      return;
    }

    second = card;
    lock = true;

    if (first.dataset.symbol === second.dataset.symbol) {
      first.classList.add("matched");
      second.classList.add("matched");
      matched += 2;
      reset();
      if (matched === symbols.length) {
        setTimeout(() => showScreen("screen2"), 500);
        startTicTacToe();
      }
    } else {
      setTimeout(() => {
        first.classList.remove("revealed");
        second.classList.remove("revealed");
        first.textContent = "";
        second.textContent = "";
        reset();
      }, 700);
    }
  }

  function reset() {
    first = null;
    second = null;
    lock = false;
  }

  build();
})();

/* -------------------------
   CHALLENGE 2 — TIC TAC TOE
--------------------------*/
let tttBoard, tttTries = 3;

function startTicTacToe() {
  tttBoard = ["","","","","","","","",""];
  const boardEl = document.getElementById("tttBoard");
  boardEl.innerHTML = "";
  document.getElementById("tttStatus").textContent = `Tries left: ${tttTries}`;

  for (let i = 0; i < 9; i++) {
    const cell = document.createElement("div");
    cell.className = "ttt-cell";
    cell.onclick = () => playerMove(i);
    boardEl.appendChild(cell);
  }
}

function playerMove(i) {
  if (tttBoard[i] !== "") return;
  tttBoard[i] = "X";
  updateBoard();

  if (checkWin("X")) {
    showScreen("screen3");
    startSimon();
    return;
  }

  if (tttBoard.every(c => c !== "")) {
    tttTries--;
    if (tttTries <= 0) restartGame();
    startTicTacToe();
    return;
  }

  botMove();
}

function botMove() {
  const empty = tttBoard.map((v,i)=>v===""?i:null).filter(v=>v!==null);
  const move = empty[Math.floor(Math.random()*empty.length)];
  tttBoard[move] = "O";
  updateBoard();

  if (checkWin("O")) {
    tttTries--;
    if (tttTries <= 0) restartGame();
    startTicTacToe();
  }
}

function updateBoard() {
  const cells = document.querySelectorAll(".ttt-cell");
  cells.forEach((c,i)=>c.textContent = tttBoard[i]);
}

function checkWin(p) {
  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return wins.some(w => w.every(i => tttBoard[i] === p));
}

/* -------------------------
   CHALLENGE 3 — SIMON COLORS
--------------------------*/
const simonColors = [
  {name:"red",    hex:"#ff4d4d"},
  {name:"blue",   hex:"#4d79ff"},
  {name:"green",  hex:"#4dff4d"},
  {name:"yellow", hex:"#ffff4d"},
  {name:"purple", hex:"#b84dff"}
];

let simonSeq = [];
let simonRound = 1;
let simonIndex = 0;
let accepting = false;

function startSimon() {
  simonSeq = [];
  simonRound = 1;
  buildSimonButtons();
  nextSimonRound();
}

function buildSimonButtons() {
  const container = document.getElementById("simonButtons");
  container.innerHTML = "";
  simonColors.forEach((c,i)=>{
    const btn = document.createElement("div");
    btn.className = "color-btn";
    btn.style.background = c.hex;
    btn.onclick = () => simonClick(i);
    container.appendChild(btn);
  });
}

function nextSimonRound() {
  accepting = false;
  simonIndex = 0;
  simonSeq.push(Math.floor(Math.random()*5));
  document.getElementById("simonStatus").textContent = `Round ${simonRound} of 3`;
  playSimonSequence();
}

function playSimonSequence() {
  const buttons = document.querySelectorAll(".color-btn");
  let i = 0;

  function flash() {
    if (i >= simonSeq.length) {
      accepting = true;
      return;
    }
    const idx = simonSeq[i];
    const btn = buttons[idx];
    btn.classList.add("active");
    setTimeout(()=>{
      btn.classList.remove("active");
      i++;
      setTimeout(flash, 300);
    }, 500);
  }

  flash();
}

function simonClick(i) {
  if (!accepting) return;

  if (i !== simonSeq[simonIndex]) {
    restartGame();
    return;
  }

  simonIndex++;

  if (simonIndex >= simonSeq.length) {
    if (simonRound === 3) {
      revealSecret();
    } else {
      simonRound++;
      setTimeout(nextSimonRound, 600);
    }
  }
}

/* -------------------------
   FINAL SECRET
--------------------------*/
function revealSecret() {
  const decoded = atob(hiddenPayload);
  document.getElementById("finalMessage").textContent = decoded;
  showScreen("finalScreen");
}

function restartGame() {
  location.reload();
}
</script>
</body>
</html>

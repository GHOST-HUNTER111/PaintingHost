<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Triple Challenge Gauntlet</title>
<style>
  body {
    margin: 0;
    background: #05060a;
    color: #f5f5f5;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 600px;
    padding: 20px;
  }

  .active {
    display: flex;
  }

  h1 {
    margin-bottom: 10px;
    color: #9fa6ff;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  button {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    padding: 10px 20px;
    border-radius: 999px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    opacity: 0.9;
  }

  /* Memory Game */
  .memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 60px);
    gap: 10px;
    margin-top: 20px;
  }

  .memory-card {
    width: 60px;
    height: 60px;
    background: #111322;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .memory-card.revealed {
    background: #2f365f;
    border-color: #6366f1;
  }

  .memory-card.matched {
    background: #1b4332;
    border-color: #2ecc71;
    color: #a9f5c6;
    cursor: default;
  }

  /* Math */
  #mathQuestion {
    font-size: 24px;
    margin-top: 20px;
  }

  input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 15px;
    width: 120px;
    text-align: center;
    font-size: 18px;
  }

  /* Ball Catch */
  #ballCanvas {
    background: #111322;
    border: 2px solid #333;
    border-radius: 10px;
  }

  /* Final Message */
  #finalMessage {
    font-size: 60px;
    font-weight: 900;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<!-- SCREEN 1: MEMORY -->
<div id="screen1" class="screen active">
  <h1>Challenge 1 — Memory Match</h1>
  <p>Match all pairs to continue.</p>
  <div class="memory-grid" id="memoryGrid"></div>
</div>

<!-- SCREEN 2: MATH -->
<div id="screen2" class="screen">
  <h1>Challenge 2 — Math Test</h1>
  <p>Solve 10 hard problems. Get at least 6 correct.</p>
  <div id="mathQuestion"></div>
  <input id="mathInput" type="number" autocomplete="off">
  <button id="submitMath">Submit</button>
  <p id="mathProgress"></p>
</div>

<!-- SCREEN 3: BALL CATCH -->
<div id="screen3" class="screen">
  <h1>Challenge 3 — Ball Catch</h1>
  <p>Click falling balls. Catch 35 out of 50.</p>
  <canvas id="ballCanvas" width="400" height="500"></canvas>
  <p id="ballScore"></p>
</div>

<!-- FINAL SCREEN -->
<div id="finalScreen" class="screen">
  <div id="finalMessage"></div>
  <button onclick="restartGame()">Play Again</button>
</div>

<script>
/* Encoded secret phrase */
const hiddenPayload = "YmxhY2sgbmlwcGxlcw==";

/* Screen switching */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* -------------------------
   CHALLENGE 1 — MEMORY
--------------------------*/
(function memoryGame() {
  const symbols = ["◆","◆","●","●","★","★","▲","▲"];
  const grid = document.getElementById("memoryGrid");
  let first = null, second = null, lock = false, matched = 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function build() {
    grid.innerHTML = "";
    matched = 0;
    shuffle(symbols.slice()).forEach(sym => {
      const card = document.createElement("div");
      card.className = "memory-card";
      card.dataset.symbol = sym;
      card.onclick = () => reveal(card);
      grid.appendChild(card);
    });
  }

  function reveal(card) {
    if (lock || card.classList.contains("matched") || card === first) return;
    card.classList.add("revealed");
    card.textContent = card.dataset.symbol;

    if (!first) {
      first = card;
      return;
    }

    second = card;
    lock = true;

    if (first.dataset.symbol === second.dataset.symbol) {
      first.classList.add("matched");
      second.classList.add("matched");
      matched += 2;
      reset();
      if (matched === symbols.length) {
        setTimeout(() => showScreen("screen2"), 500);
      }
    } else {
      setTimeout(() => {
        first.classList.remove("revealed");
        second.classList.remove("revealed");
        first.textContent = "";
        second.textContent = "";
        reset();
      }, 700);
    }
  }

  function reset() {
    first = null;
    second = null;
    lock = false;
  }

  build();
})();

/* -------------------------
   CHALLENGE 2 — MATH
--------------------------*/
let mathIndex = 0;
let mathCorrect = 0;
let currentAnswer = 0;

function generateHardProblem() {
  const types = [
    () => `${a=rand(3,9)} × (${b=rand(2,8)} + ${c=rand(1,6)})`,
    () => `${a=rand(10,30)} ÷ ${b=rand(2,6)} + ${c=rand(1,10)}`,
    () => `(${a=rand(3,9)} × ${b=rand(3,9)}) - ${c=rand(2,10)}`
  ];
  const pick = types[Math.floor(Math.random()*types.length)];
  const expr = pick();
  currentAnswer = eval(expr.replace("×","*").replace("÷","/"));
  return expr;
}

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

const mathQ = document.getElementById("mathQuestion");
const mathInput = document.getElementById("mathInput");
const mathProgress = document.getElementById("mathProgress");

function nextMath() {
  if (mathIndex === 10) {
    if (mathCorrect >= 6) {
      showScreen("screen3");
      startBallGame();
    } else {
      restartGame();
    }
    return;
  }

  const q = generateHardProblem();
  mathQ.textContent = q;
  mathProgress.textContent = `Question ${mathIndex+1} / 10`;
  mathInput.value = "";
  mathInput.focus();
}

document.getElementById("submitMath").onclick = () => {
  if (Number(mathInput.value) === Math.round(currentAnswer)) {
    mathCorrect++;
  }
  mathIndex++;
  nextMath();
};

/* -------------------------
   CHALLENGE 3 — BALL CATCH
--------------------------*/
let ctx, balls, caught, total, running;

function startBallGame() {
  const canvas = document.getElementById("ballCanvas");
  ctx = canvas.getContext("2d");
  balls = [];
  caught = 0;
  total = 0;
  running = true;

  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    balls.forEach(b => {
      if (!b.hit && Math.hypot(b.x - x, b.y - y) < b.r) {
        b.hit = true;
        caught++;
      }
    });
  };

  spawnBall();
  loop();
}

function spawnBall() {
  if (total >= 50) return;
  balls.push({
    x: Math.random()*380+10,
    y: -20,
    r: 12,
    speed: Math.random()*3+2,
    drift: (Math.random()*2-1)*1.5,
    hit: false
  });
  total++;
  setTimeout(spawnBall, 300);
}

function loop() {
  if (!running) return;

  ctx.clearRect(0,0,400,500);

  balls.forEach(b => {
    if (!b.hit) {
      b.y += b.speed;
      b.x += b.drift;
    }
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle = b.hit ? "#1b4332" : "#8b5cf6";
    ctx.fill();
  });

  balls = balls.filter(b => b.y < 520);

  document.getElementById("ballScore").textContent =
    `Caught: ${caught} / ${total}`;

  if (total === 50 && balls.length === 0) {
    running = false;
    if (caught >= 35) {
      revealSecret();
    } else {
      restartGame();
    }
    return;
  }

  requestAnimationFrame(loop);
}

/* -------------------------
   FINAL SECRET
--------------------------*/
function revealSecret() {
  const decoded = atob(hiddenPayload);
  document.getElementById("finalMessage").textContent = decoded;
  showScreen("finalScreen");
}

function restartGame() {
  location.reload();
}
</script>
</body>
</html>
